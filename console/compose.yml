# Xpods management console. Start with ./console.sh up (it writes .env first).
name: xpods-console

services:
  console:
    build: .
    image: xpods-console:local
    restart: unless-stopped
    # Host netns: deploy.sh port checks see real host sockets, and the UI binds to
    # CONSOLE_HOST (127.0.0.1 by default) on the host directly.
    network_mode: host
    user: "${CONSOLE_UID:?run ./console.sh init}:${CONSOLE_GID}"
    # Docker socket access. NOTE: this is root-equivalent on the host; keep the
    # console on loopback / behind an authenticated TLS reverse proxy or VPN.
    group_add: ["${DOCKER_GID}"]
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m
    env_file: .env
    environment:
      CONSOLE_DB: /data/console.db
      HOME: /tmp
      DOCKER_CONFIG: /data/docker
      UVICORN_HOST: ${CONSOLE_HOST:-127.0.0.1}
      UVICORN_PORT: ${CONSOLE_PORT:-8088}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Same absolute path as on the host: deploy.sh hands bind-mount paths to the
      # Docker daemon, which resolves them on the host.
      - ${REPO_DIR}:${REPO_DIR}
      - ./data:/data
    mem_limit: 512m
    pids_limit: 512
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Local LLM for the console assistant. Loopback-only; the console (host netns)
  # reaches it on 127.0.0.1:${CONSOLE_LLM_PORT}. Models persist in the named volume.
  ollama:
    image: ollama/ollama:0.34.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CONSOLE_LLM_PORT:-11500}:11434"
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "8192"
    volumes:
      - ollama-models:/root/.ollama
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: ${CONSOLE_LLM_MEM:-5g}
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Shared, expandable event store for Xpod activity AND browser telemetry.
  # Loopback-only, security plugin disabled (single-node trust boundary is the host);
  # only the console (host netns) talks to it on 127.0.0.1.
  opensearch:
    image: opensearchproject/opensearch:2.19.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      # Single-node dev store: don't flip to read-only on a small disk.
      cluster.routing.allocation.disk.threshold_enabled: "false"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports:
      - "127.0.0.1:${CONSOLE_OS_PORT:-9200}:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    mem_limit: ${CONSOLE_OS_MEM:-1500m}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  opensearch-data:
  ollama-models:
